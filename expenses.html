<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家庭支出记账</title>
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/main-Cyh-sEUN.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body>
    <div class="container bg-white rounded-2xl shadow-lg mx-4 mt-4 p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-3xl font-bold text-gray-800"><i class="bi bi-house-heart-fill"></i>🏠Wenger家庭记账本</h1>
        </div>
        <form id="expenseForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">选择日期</label>
                <input id="date" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="text-center p-4 rounded-xl bg-green-50">
                <div class="text-sm text-gray-600 mb-1">日预算</div>
                <div class="text-3xl font-bold text-gray-800">¥500</div>
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <div class="text-sm text-gray-600 mb-1">已支出</div>
                    <div class="text-2xl font-semibold text-gray-800" id="spendBudget"></div>
                </div>
                <div class="mt-4">
                    <div class="text-lg font-bold text-green-600" id="leftBudget"></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-lg mx-t mt-4 p-6">
                <h2 class="text-lg font-monospace text-gray-800 mb-4">选择支出类别</h2>
                <div class="grid grid-cols-3 gap-2" id="categoryButtons">
                    <button data-value="早餐" type="button" class="p-3 rounded-xl text-center transition-all bg-blue-500 text-white shadow-md transform scale-105">
                        <div class="text-xl mb-1">🥪</div>
                        <div class="text-xs">早餐</div>
                    </button>
                    <button data-value="午餐" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">🍱</div>
                        <div class="text-xs">午餐</div>
                    </button>
                    <button data-value="晚餐" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">🍽️</div>
                        <div class="text-xs">晚餐</div>
                    </button>
                    <button data-value="咖啡饮料" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">🥤</div>
                        <div class="text-xs">饮料</div>
                    </button>
                    <button data-value="旅行" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">✈️</div>
                        <div class="text-xs">旅行</div>
                    </button>
                    <button data-value="教育" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">👧</div>
                        <div class="text-xs">教育</div>
                    </button>
                    <button data-value="超市" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">🛒</div>
                        <div class="text-xs">超市</div>
                    </button>
                    <button data-value="网购" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">🛍️</div>
                        <div class="text-xs">网购</div>
                    </button>
                    <button data-value="水电费" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">💧</div>
                        <div class="text-xs">水电费</div>
                    </button>
                    <button data-value="其他" type="button" class="p-3 rounded-xl text-center transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        <div class="text-xl mb-1">📝</div>
                        <div class="text-xs">其他</div>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg mx-4 mt-4 p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">输入金额</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">金额（元）</label>
                        <input id="amount" type="number" min="0" max="100000" step="0.01" class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入金额" value="" required>
                    </div>
                </div>
            </div>
            <div class="mx-4 mt-4 mb-4">
                <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-4 rounded-xl shadow-lg hover:bg-blue-600 transition-colors disabled:bg-gray-300">添加支出记录</button>
            </div>
        </form>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-blue-500 text-black" id="records-tab" data-bs-toggle="tab" data-bs-target="#records" type="button" role="tab" aria-controls="records" aria-selected="true">今日支出</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab" aria-controls="stats" aria-selected="false">按月统计</button>
            </li>
        </ul>
        <div class="tab-content bg-white rounded-2xl shadow-lg p-6 mb-4" id="myTabContent">
            <div class="tab-pane fade show active" id="records" role="tabpanel" aria-labelledby="records-tab">
                <table id="expenseTable" class="table">
                    <thead>
                        <tr>
                            <th>类别</th>
                            <th>金额</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="tab-pane fade" id="stats" role="tabpanel" aria-labelledby="stats-tab">
                <div class="text-gray-700 mb-3">
                    <label for="monthSelect" class="form-label">选择月份:</label>
                    <select id="monthSelect" class="form-select"></select>
                </div>
                <div class="mb-6">
                    <h3 class="text-md font-semibold text-gray-800 mb-3">支出类别分布</h3>
                    <div class="space-y-3" id="statsDiv"></div>
                </div>
            </div>
        </div>
        <footer class="text-center mt-4">
            <p>© 2026 Wenger家庭支出记账</p>
            <p><a href="https://www.beian.gov.cn/" target="_blank">沪ICP备2026003370号</a></p>
        </footer>
    </div>

    <script>
        const DAILY_BUDGET = 500;
        const ACCESS_PASSWORD = '7758';

        const form = document.getElementById('expenseForm');
        const tableBody = document.querySelector('#expenseTable tbody');
        const monthSelect = document.getElementById('monthSelect');
        const statsDiv = document.getElementById('statsDiv');
        const spendBudget = document.getElementById('spendBudget');
        const leftBudget = document.getElementById('leftBudget');
        const amountInput = document.getElementById('amount');
        const submitBtn = document.querySelector('button[type="submit"]');
        const categoryButtons = document.querySelectorAll('#categoryButtons button[data-value]');

        const categories = {
            "早餐": { name: "早餐", emoji: "🥪", color: "#60a5fa" },
            "午餐": { name: "午餐", emoji: "🍱", color: "#f59e42" },
            "晚餐": { name: "晚餐", emoji: "🍽️", color: "#f87171" },
            "咖啡饮料": { name: "饮料", emoji: "🥤", color: "#34d399" },
            "旅行": { name: "旅行", emoji: "✈️", color: "#818cf8" },
            "教育": { name: "教育", emoji: "👧", color: "#fbbf24" },
            "超市": { name: "超市", emoji: "🛒", color: "#a3e635" },
            "网购": { name: "网购", emoji: "🛍️", color: "#f472b6" },
            "水电费": { name: "水电费", emoji: "💧", color: "#38bdf8" },
            "其他": { name: "其他", emoji: "📝", color: "#9ca3af" }
        };

        function getCategoryMeta(category) {
            return categories[category] || { emoji: "🏷️", name: category, color: "#94a3b8" };
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(`Request failed: ${response.status}`);
            }
            return response.json();
        }

        function getSelectedCategory() {
            const selectedButton = document.querySelector('#categoryButtons button[data-value].bg-blue-500');
            return selectedButton ? selectedButton.getAttribute('data-value') : '';
        }

        function setActiveCategory(button) {
            categoryButtons.forEach((btn) => {
                btn.classList.remove('bg-blue-500', 'text-white', 'shadow-md', 'transform', 'scale-105');
                btn.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
            });
            button.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
            button.classList.add('bg-blue-500', 'text-white', 'shadow-md', 'transform', 'scale-105');
        }

        function toggleSubmitBtn() {
            if (!amountInput.value) {
                submitBtn.disabled = true;
                submitBtn.classList.add('bg-gray-300');
                submitBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-300');
                submitBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
            }
        }

        function updateBudget(totalSpend) {
            spendBudget.textContent = `¥${totalSpend.toFixed(2)}`;
            const left = DAILY_BUDGET - totalSpend;
            leftBudget.textContent = `剩余 ¥${left.toFixed(2)}`;
            leftBudget.classList.toggle('text-red-600', left < 0);
            leftBudget.classList.toggle('text-green-600', left >= 0);
        }

        function renderTable(expenses) {
            tableBody.innerHTML = '';
            let totalSpend = 0;

            expenses.forEach((expense) => {
                totalSpend += parseFloat(expense.amount);
                const meta = getCategoryMeta(expense.category);
                const row = tableBody.insertRow();
                row.insertCell(0).textContent = `${meta.emoji} ${meta.name}`;
                row.insertCell(1).textContent = Number(expense.amount).toFixed(2);
                const deleteCell = row.insertCell(2);
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '删除';
                deleteBtn.className = 'btn btn-danger btn-sm';
                deleteBtn.onclick = () => deleteExpense(expense.id);
                deleteCell.appendChild(deleteBtn);
            });

            updateBudget(totalSpend);
        }

        async function loadExpenses() {
            const selectedDate = document.getElementById('date').value;
            try {
                const expenses = await fetchJson(`/expenses?date=${selectedDate}`);
                renderTable(expenses);
            } catch (error) {
                console.error('Error loading expenses:', error);
            }
        }

        async function deleteExpense(id) {
            if (!confirm('确定删除这条记录吗？')) {
                return;
            }
            try {
                await fetchJson(`/expenses/${id}`, { method: 'DELETE' });
                await loadExpenses();
            } catch (error) {
                console.error('Error deleting expense:', error);
            }
        }

        function updateMonthSelect(monthdata, selectedMonth) {
            const months = [...new Set(monthdata.map(item => item.month))].sort();
            monthSelect.innerHTML = '<option value="">Total</option>';
            months.forEach((month) => {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
            if (selectedMonth && months.includes(selectedMonth)) {
                monthSelect.value = selectedMonth;
            }
        }

        function getDaysInMonth(month) {
            const [year, mon] = month.split('-').map(Number);
            return new Date(year, mon, 0).getDate();
        }

        function showStats(month, monthdata) {
            const filtered = month ? monthdata.filter((item) => item.month === month) : monthdata;
            const total = filtered.reduce((sum, item) => sum + parseFloat(item.amount), 0);
            const sortedCategories = [...filtered].sort((a, b) => parseFloat(b.amount) - parseFloat(a.amount));

            const summaryHtml = month
                ? (() => {
                    const monthBudget = getDaysInMonth(month) * DAILY_BUDGET;
                    const surplus = Math.round(monthBudget - total);
                    const surplusClass = surplus < 0 ? 'text-red-600' : 'text-green-600';
                    return `<div class="text-sm text-gray-600 mb-6">总支出: ${Math.round(total)} | <span class="${surplusClass}">盈余: ${surplus}</span></div>`;
                })()
                : `<div class="text-sm text-gray-600 mb-6">总支出: ${Math.round(total)}</div>`;

            const rowsHtml = sortedCategories.map((item) => {
                const meta = getCategoryMeta(item.category);
                const amount = parseFloat(item.amount);
                const width = total > 0 ? Math.min(100, (amount / total) * 100) : 0;
                return `<div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-medium text-gray-700 truncate">${meta.emoji} ${meta.name}</span>
                    </div>
                    <div class="flex-1 relative">
                        <div class="w-full bg-gray-200 rounded-full h-6 overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-500 flex items-center justify-content-end pr-2" style="width: ${width}%; background-color: ${meta.color};"></div>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 w-12 text-right">${amount.toFixed(2)}</div>
                </div>`;
            }).join('');

            statsDiv.innerHTML = summaryHtml + rowsHtml;
        }

        async function loadMonthStats(selectedMonthOverride = null) {
            try {
                const selectedMonth = selectedMonthOverride ?? monthSelect.value;
                const monthdata = await fetchJson('/monthData');
                updateMonthSelect(monthdata, selectedMonth);
                showStats(monthSelect.value, monthdata);
            } catch (error) {
                console.error('Error loading month stats:', error);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            try {
                await fetchJson('/expenses/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: document.getElementById('date').value,
                        amount: parseFloat(amountInput.value),
                        category: getSelectedCategory(),
                    }),
                });
                amountInput.value = '';
                toggleSubmitBtn();
                await loadExpenses();
                await loadMonthStats();
            } catch (error) {
                console.error('Error adding expense:', error);
            }
        });

        monthSelect.addEventListener('change', loadMonthStats);
        document.getElementById('date').addEventListener('change', loadExpenses);
        amountInput.addEventListener('input', toggleSubmitBtn);
        categoryButtons.forEach((button) => button.addEventListener('click', () => setActiveCategory(button)));
        document.getElementById('stats-tab').addEventListener('shown.bs.tab', loadMonthStats);

        document.addEventListener('DOMContentLoaded', async () => {
            const password = prompt('请输入密码以继续:');
            if (password !== ACCESS_PASSWORD) {
                alert('密码错误，无法访问页面。');
                document.body.innerHTML = "<h1 style='text-align:center;color:red;'>访问被拒绝</h1>";
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            const currentMonth = new Date().toISOString().substring(0, 7);
            monthSelect.value = currentMonth;
            toggleSubmitBtn();
            await loadExpenses();
            await loadMonthStats(currentMonth);
        });
    </script>
    <script src="/static/bootstrap.bundle.min.js"></script>
</body>
</html>
