<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta property="og:type" content="website">
    <meta property="og:title" content="灵光全模态AI助手">
    <meta property="og:description" content="让复杂，变简单">
    <meta property="og:image" content="https://mdn.alipayobjects.com/huamei_mrdrkc/afts/img/eOzcTIg_xy0AAAAAQiAAAAgADnRDAQFr/original">
    <meta property="og:url" content="https://www.lingguang.com">
    <meta name="description" content="让复杂，变简单">
    <meta name="keywords" content="灵光, AI对话, AI, AIGC, AI视频, AI生图, AGI">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="bm_app_id" content="null">
    <meta name="bm_sprint_id" content="S090011427856">
    <meta name="data-aspm" content="a5022">
    <meta name="data-bizType" content="common">

    <title>家庭支出记账</title>
    <link rel="stylesheet" href=".venv/assets/bootstrap.min.css">

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        #stats { margin-top: 20px; }
        .categories { display: flex; flex-wrap: wrap; gap: 10px; }
        .category { padding: 10px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
        .category:hover { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>支出记账</h1>
        <form id="expenseForm">
            <div class="mb-3">
                <label for="date" class="form-label">日期:</label>
                <input type="date" id="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">金额:</label>
                <input type="number" id="amount" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">类别:</label>
                <div class="categories">
                    <div class="category" data-value="早餐">早餐</div>
                    <div class="category" data-value="午餐">午餐</div>
                    <div class="category" data-value="晚餐">晚餐</div>
                    <div class="category" data-value="咖啡饮料">咖啡饮料</div>
                    <div class="category" data-value="网购">网购</div>
                    <div class="category" data-value="其他">其他</div>
                    <input type="text" id="customCategory" style="display:none;" placeholder="输入自定义类别" class="form-control mt-2">
                </div>
                <input type="hidden" id="category" required>
            </div>
            <button type="submit" class="btn btn-primary">添加支出</button>
        </form>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="records-tab" data-bs-toggle="tab" data-bs-target="#records" type="button" role="tab" aria-controls="records" aria-selected="true">支出记录</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab" aria-controls="stats" aria-selected="false">按月统计</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="records" role="tabpanel" aria-labelledby="records-tab">
                <table id="expenseTable" class="table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>金额</th>
                            <th>类别</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="tab-pane fade" id="stats" role="tabpanel" aria-labelledby="stats-tab">
                <div class="mb-3">
                    <label for="monthSelect" class="form-label">选择月份:</label>
                    <select id="monthSelect" class="form-select"></select>
                </div>
                <div id="statsDiv"></div>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById('expenseForm');
        const tableBody = document.querySelector('#expenseTable tbody');
        const monthSelect = document.getElementById('monthSelect');
        const statsDiv = document.getElementById('statsDiv');

        async function loadExpenses() {
            try {
                const response = await fetch('http://0.0.0.0:8000/expenses/', {
                    method: 'GET',
                });
                const expenses = await response.json();
                renderTable(expenses);
                updateMonthSelect(expenses);
            } catch (error) {
                console.error('Error loading expenses:', error);
            }
        }

        function renderTable(expenses) {
            tableBody.innerHTML = '';
            expenses.forEach(expense => {
                const row = tableBody.insertRow();
                row.insertCell(0).textContent = expense.date;
                row.insertCell(1).textContent = expense.amount;
                row.insertCell(2).textContent = expense.category;
                const deleteCell = row.insertCell(3);
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '删除';
                deleteBtn.className = 'btn btn-danger btn-sm';
                deleteBtn.onclick = () => deleteExpense(expense.id);
                deleteCell.appendChild(deleteBtn);
            });
        }

        async function deleteExpense(id) {
            if (confirm('确定删除这条记录吗？')) {
                try {
                    const response = await fetch(`http://0.0.0.0:8000/expenses/${id}`, {
                        method: 'DELETE',
                    });
                    if (response.ok) {
                        loadExpenses();
                    } else {
                        console.error('Error deleting expense');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        function updateMonthSelect(expenses) {
            const months = [...new Set(expenses.map(e => e.date.substring(0, 7)))];
            monthSelect.innerHTML = '<option value="">选择月份</option>';
            months.forEach(month => {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
        }

        function showStats(month, expenses) {
            const filtered = expenses.filter(e => e.date.startsWith(month));
            const total = filtered.reduce((sum, e) => sum + parseFloat(e.amount), 0);
            const byCategory = {};
            filtered.forEach(e => {
                byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount);
            });
            statsDiv.innerHTML = `<p>总支出: ${total.toFixed(2)}</p>`;
            for (const [cat, amt] of Object.entries(byCategory)) {
                statsDiv.innerHTML += `<p>${cat}: ${amt.toFixed(2)}</p>`;
            }
        }

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            try {
                const response = await fetch('http://0.0.0.0:8000/expenses/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ date, amount, category }),
                });
                if (response.ok) {
                    loadExpenses();
                } else {
                    console.error('Error adding expense');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        monthSelect.addEventListener('change', async () => {
            const response = await fetch('http://0.0.0.0:8000/expenses/');
            const expenses = await response.json();
            showStats(monthSelect.value, expenses);
        });

        document.querySelectorAll('.category').forEach(div => {
            div.addEventListener('click', () => {
                const value = div.getAttribute('data-value');
                document.querySelectorAll('.category').forEach(d => d.style.backgroundColor = '');
                div.style.backgroundColor = '#d1e7dd';
                const customCategoryInput = document.getElementById('customCategory');
                if (value === '其他') {
                    customCategoryInput.style.display = 'block';
                    customCategoryInput.focus();
                    document.getElementById('category').value = customCategoryInput.value || '其他';
                } else {
                    customCategoryInput.style.display = 'none';
                    document.getElementById('category').value = value;
                }
            });
        });

        // Leverage dayjs for date selection: set default date to today
        document.getElementById('date').value = dayjs().format('YYYY-MM-DD');

        loadExpenses();
    </script>
    <script src=".venv/assets/bootstrap.bundle.min.js"></script>
    <script src=".venv/assets/dayjs.min.js"></script>
</body>
</html>
